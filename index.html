<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abelino Tapas — Carta Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F4EDD6;
      --bg2: #EDE3C5;
      --navy: #1C3D5A;
      --navy2: #15304A;
      --amber: #C8783A;
      --amber-light: #E09558;
      --sea: #3D7A6F;
      --text: #1E2022;
      --text-soft: #6B7280;
      --white: #FFFDF7;
      --border: rgba(28,61,90,0.13);
      --shadow: 0 4px 24px rgba(28,61,90,0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }

    /* ─── HERO ─── */
    .hero {
      background: var(--navy);
      color: var(--white);
      text-align: center;
      padding: 56px 20px 72px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 15% 60%, rgba(61,122,111,0.35) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 40%, rgba(200,120,58,0.25) 0%, transparent 55%);
    }
    .hero-inner { position: relative; z-index: 1; }
    .hero-eyebrow {
      font-size: 10px; letter-spacing: 4px; text-transform: uppercase;
      color: var(--amber-light); margin-bottom: 10px; font-weight: 500;
    }
    .hero-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(52px, 12vw, 88px);
      font-weight: 700; line-height: 0.92; letter-spacing: -1px;
    }
    .hero-title em { font-style: italic; color: var(--amber-light); }
    .hero-tagline {
      margin-top: 14px; font-size: 13px;
      color: rgba(255,255,255,0.5); letter-spacing: 2.5px; text-transform: uppercase;
    }
    .hero-wave {
      position: absolute; bottom: -1px; left: 0; right: 0;
      line-height: 0;
    }
    .hero-wave svg { display: block; width: 100%; }

    /* ─── STICKY NAV ─── */
    .nav-sticky {
      position: sticky; top: 0; z-index: 100;
      background: var(--navy2);
      border-bottom: 2px solid var(--amber);
      overflow-x: auto; scrollbar-width: none;
    }
    .nav-sticky::-webkit-scrollbar { display: none; }
    .nav-inner {
      display: flex; padding: 0 16px;
      max-width: 960px; margin: 0 auto; white-space: nowrap;
    }
    .nav-btn {
      background: none; border: none; border-bottom: 3px solid transparent;
      color: rgba(255,255,255,0.55);
      font-family: 'DM Sans', sans-serif;
      font-size: 11px; font-weight: 500; letter-spacing: 1.8px;
      text-transform: uppercase; padding: 13px 14px;
      cursor: pointer; transition: color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .nav-btn:hover { color: rgba(255,255,255,0.9); }
    .nav-btn.active { color: var(--amber-light); border-bottom-color: var(--amber-light); }

    /* ─── MAIN ─── */
    .main { max-width: 960px; margin: 0 auto; padding: 0 20px 120px; }

    /* ─── SECTION ─── */
    .section { padding-top: 52px; scroll-margin-top: 50px; }
    .section-head {
      display: flex; align-items: baseline; gap: 14px;
      margin-bottom: 22px; padding-bottom: 10px;
      border-bottom: 2px solid var(--navy);
    }
    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 38px; font-weight: 700; color: var(--navy); line-height: 1;
    }
    .section-note { font-size: 11px; color: var(--text-soft); font-style: italic; }

    /* ─── MENU GRID ─── */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 10px;
    }
    .menu-card {
      background: var(--white); border-radius: 12px;
      padding: 15px 16px; border: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.04);
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .menu-card:hover {
      border-color: rgba(200,120,58,0.5);
      box-shadow: 0 4px 20px rgba(28,61,90,0.1);
      transform: translateY(-1px);
    }
    .card-info { flex: 1; min-width: 0; }
    .card-name { font-size: 14px; font-weight: 500; line-height: 1.35; color: var(--text); }
    .card-desc { font-size: 11px; color: var(--text-soft); margin-top: 3px; font-style: italic; line-height: 1.3; }
    .card-type {
      font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase;
      font-weight: 600; margin-top: 4px;
    }
    .type-tinto { color: #8B1A2E; }
    .type-blanco { color: var(--sea); }
    .type-espumante { color: #7B5EA7; }

    /* ─── ADD / QTY CONTROLS ─── */
    .add-btn {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--navy); color: white; border: none;
      font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.2s, transform 0.15s; line-height: 1;
    }
    .add-btn:hover { background: var(--amber); transform: scale(1.1); }
    .qty-ctl {
      display: none; align-items: center; gap: 7px; flex-shrink: 0;
    }
    .qty-btn {
      width: 28px; height: 28px; border-radius: 50%;
      border: 1.5px solid var(--amber); background: none;
      color: var(--amber); font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; line-height: 1;
    }
    .qty-btn:hover { background: var(--amber); color: white; }
    .qty-n { font-weight: 700; font-size: 15px; color: var(--navy); min-width: 18px; text-align: center; }

    /* ─── WINE SUB ─── */
    .wine-region-badge {
      display: inline-block;
      background: var(--navy); color: var(--amber-light);
      font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
      font-weight: 600; padding: 5px 12px; border-radius: 4px;
      margin: 10px 0 18px;
    }
    .wine-bodega { margin-bottom: 22px; }
    .wine-bodega-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 21px; font-weight: 600; color: var(--navy);
      margin-bottom: 10px;
    }

    /* ─── CART FAB ─── */
    .cart-fab {
      position: fixed; bottom: 26px; right: 22px;
      background: var(--navy); color: white; border: none;
      border-radius: 50px; padding: 14px 20px;
      font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 8px 32px rgba(28,61,90,0.35);
      z-index: 200; transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      transform: translateY(120px); opacity: 0;
    }
    .cart-fab.visible { transform: translateY(0); opacity: 1; }
    .cart-fab:hover { background: var(--amber); transform: translateY(-3px); box-shadow: 0 12px 40px rgba(200,120,58,0.4); }
    .cart-fab svg { width: 18px; height: 18px; }
    .cart-badge {
      background: var(--amber); color: white;
      width: 22px; height: 22px; border-radius: 50%;
      font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .cart-fab:hover .cart-badge { background: white; color: var(--amber); }

    /* ─── OVERLAY ─── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(10,20,30,0.55);
      z-index: 300; opacity: 0; pointer-events: none;
      transition: opacity 0.3s; backdrop-filter: blur(3px);
    }
    .overlay.open { opacity: 1; pointer-events: all; }

    /* ─── CART DRAWER ─── */
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: min(420px, 100vw);
      background: var(--white); z-index: 400;
      transform: translateX(100%);
      transition: transform 0.36s cubic-bezier(0.4,0,0.2,1);
      display: flex; flex-direction: column;
      box-shadow: -8px 0 48px rgba(0,0,0,0.18);
    }
    .drawer.open { transform: translateX(0); }

    .drawer-head {
      background: var(--navy); color: white;
      padding: 20px 22px; display: flex;
      align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .drawer-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px; font-weight: 700;
    }
    .drawer-close {
      background: none; border: none; color: rgba(255,255,255,0.7);
      font-size: 26px; cursor: pointer; line-height: 1; padding: 4px;
      transition: color 0.2s;
    }
    .drawer-close:hover { color: white; }

    .drawer-body { flex: 1; overflow-y: auto; padding: 18px 22px; }

    .empty-cart { text-align: center; padding: 64px 20px; color: var(--text-soft); }
    .empty-cart-icon { font-size: 52px; margin-bottom: 14px; }
    .empty-cart-msg { font-size: 15px; line-height: 1.5; }

    .ci { /* cart item */
      display: flex; align-items: center; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid var(--border);
    }
    .ci-info { flex: 1; min-width: 0; }
    .ci-name { font-size: 14px; font-weight: 500; }
    .ci-sub { font-size: 11px; color: var(--text-soft); margin-top: 2px; font-style: italic; }
    .ci-qty { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .cq-btn {
      width: 26px; height: 26px; border-radius: 50%;
      border: 1.5px solid var(--border); background: none;
      color: var(--text); cursor: pointer; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .cq-btn:hover { border-color: var(--amber); color: var(--amber); }
    .cq-n { font-size: 14px; font-weight: 600; min-width: 18px; text-align: center; }

    .notes-section { padding: 16px 0; }
    .notes-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-soft); margin-bottom: 8px; }
    .notes-input {
      width: 100%; padding: 10px 12px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-family: 'DM Sans', sans-serif; font-size: 13px;
      resize: vertical; min-height: 72px; color: var(--text);
      background: var(--bg); transition: border-color 0.2s;
    }
    .notes-input:focus { outline: none; border-color: var(--amber); }

    .drawer-foot {
      padding: 14px 22px 22px; flex-shrink: 0;
      border-top: 2px solid var(--border);
    }
    .cart-count-line {
      font-size: 12px; color: var(--text-soft);
      margin-bottom: 12px; text-align: center;
    }
    .wa-btn {
      width: 100%; padding: 15px;
      background: #22C55E; color: white; border: none;
      border-radius: 12px; font-family: 'DM Sans', sans-serif;
      font-size: 15px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: all 0.2s; box-shadow: 0 4px 16px rgba(34,197,94,0.3);
    }
    .wa-btn:hover { background: #16a34a; transform: translateY(-1px); box-shadow: 0 6px 24px rgba(34,197,94,0.4); }
    .wa-btn svg { width: 20px; height: 20px; }
    .clear-btn {
      width: 100%; margin-top: 8px; padding: 9px;
      background: none; color: var(--text-soft);
      border: 1px solid var(--border); border-radius: 8px;
      font-family: 'DM Sans', sans-serif; font-size: 12px;
      cursor: pointer; transition: all 0.2s;
    }
    .clear-btn:hover { border-color: #EF4444; color: #EF4444; }

    /* ─── TOAST ─── */
    .toast {
      position: fixed; bottom: 88px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--navy); color: white;
      padding: 9px 18px; border-radius: 50px; font-size: 13px; font-weight: 500;
      z-index: 500; opacity: 0; transition: all 0.28s; white-space: nowrap;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ─── FOOTER ─── */
    .site-footer {
      background: var(--navy); color: rgba(255,255,255,0.5);
      text-align: center; padding: 28px 20px; font-size: 12px; letter-spacing: 0.5px;
    }
    .site-footer strong { color: var(--amber-light); }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 600px) {
      .menu-grid { grid-template-columns: 1fr; }
      .hero { padding: 40px 16px 56px; }
      .section { padding-top: 38px; }
    }
  </style>
</head>

    <button class="clear-btn" onclick="clearCart()">Vaciar carrito</button>
  </div>
</aside>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- FOOTER -->
<footer class="site-footer">
  <strong>Abelino Tapas</strong> · Playa Unión, Chubut · Reservas: 280 453-6263
</footer>

// ═══════════════════════════════════════
// CART STATE
// ═══════════════════════════════════════
let cart = {};

function cartCount() {
  return Object.values(cart).reduce((s,i) => s + i.qty, 0);
}

function addItem(id, name, desc) {
  if (cart[id]) cart[id].qty++;
  else cart[id] = { name, qty:1, desc: desc||'' };
  syncItemUI(id);
  updateFab();
  renderDrawer();
  showToast('✓ ' + name);
}

function removeItem(id) {
  if (!cart[id]) return;
  cart[id].qty--;
  if (cart[id].qty <= 0) delete cart[id];
  syncItemUI(id);
  updateFab();
  renderDrawer();
}

function syncItemUI(id) {
  const qty = cart[id]?.qty || 0;
  const addBtn = document.querySelector(`.add-btn[data-id="${id}"]`);
  const qtyCtl = document.querySelector(`.qty-ctl[data-id="${id}"]`);
  if (!addBtn || !qtyCtl) return;
  if (qty > 0) {
    addBtn.style.display = 'none';
    qtyCtl.style.display = 'flex';
    qtyCtl.querySelector('.qty-n').textContent = qty;
  } else {
    addBtn.style.display = 'flex';
    qtyCtl.style.display = 'none';
  }
}

function updateFab() {
  const n = cartCount();
  const fab = document.getElementById('cartFab');
  document.getElementById('cartBadge').textContent = n;
  fab.classList.toggle('visible', n > 0);
}

function openCart() {
  renderDrawer();
  document.getElementById('drawer').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

function closeCart() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

function renderDrawer() {
  const body = document.getElementById('drawerBody');
  const entries = Object.entries(cart);
  const count = cartCount();
  document.getElementById('cartCountLine').textContent =
    count > 0 ? `${count} producto${count !== 1 ? 's' : ''} en tu pedido` : '';

  if (entries.length === 0) {
    body.innerHTML = `
      <div class="empty-cart">
        <div class="empty-cart-icon">🍽️</div>
        <div class="empty-cart-msg">Tu carrito está vacío.<br>¡Agregá algo rico de la carta!</div>
      </div>`;
    return;
  }

  let html = '';
  entries.forEach(([id, item]) => {
    const safeName = item.name.replace(/'/g, "\\'");
    const safeDesc = item.desc.replace(/'/g, "\\'");
    html += `
      <div class="ci">
        <div class="ci-info">
          <div class="ci-name">${item.name}</div>
          ${item.desc ? `<div class="ci-sub">${item.desc}</div>` : ''}
        </div>
        <div class="ci-qty">
          <button class="cq-btn" onclick="removeItem('${id}')">−</button>
          <span class="cq-n">${item.qty}</span>
          <button class="cq-btn" onclick="addItem('${id}','${safeName}','${safeDesc}')">+</button>
        </div>
      </div>`;
  });

  html += `
    <div class="notes-section">
      <div class="notes-label">Notas / Aclaraciones</div>
      <textarea class="notes-input" id="cartNotes" placeholder="Ej: sin cebolla, sin gluten, preparación del pescado, salsa de la pasta, mesa afuera..."></textarea>
    </div>`;

  body.innerHTML = html;
}

function clearCart() {
  cart = {};
  document.querySelectorAll('.add-btn').forEach(b => b.style.display = 'flex');
  document.querySelectorAll('.qty-ctl').forEach(e => e.style.display = 'none');
  updateFab();
  renderDrawer();
  showToast('🗑️ Carrito vaciado');
}

function sendToWhatsApp() {
  const entries = Object.entries(cart);
  if (!entries.length) { showToast('Agregá algo al carrito primero'); return; }

  let msg = '🦞 *Pedido — Abelino Tapas*\n\n📋 *Detalle:*\n';
  entries.forEach(([, item]) => {
    msg += `• ${item.name} ×${item.qty}\n`;
    if (item.desc && item.desc.includes('/')) {
      msg += `  _(indicar preparación/salsa al confirmar)_\n`;
    }
  });

  const notes = document.getElementById('cartNotes')?.value?.trim();
  if (notes) msg += `\n💬 *Notas:* ${notes}`;
  msg += '\n\n_Enviado desde la carta digital de Abelino Tapas_ 🌊';

  window.open(`https://wa.me/542804536263?text=${encodeURIComponent(msg)}`, '_blank');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ═══════════════════════════════════════
// RENDER MENU
// ═══════════════════════════════════════
function itemCard(item) {
  const desc = item.desc || '';
  const typeClass = item.type === 'Tinto' ? 'type-tinto' : item.type === 'Blanco' ? 'type-blanco' : item.type === 'Espumante' ? 'type-espumante' : '';
  const safeName = item.name.replace(/'/g, "\\'");
  const safeDesc = desc.replace(/'/g, "\\'");

  return `
    <div class="menu-card">
      <div class="card-info">
        <div class="card-name">${item.name}</div>
        ${desc ? `<div class="card-desc">${desc}</div>` : ''}
        ${item.type ? `<div class="card-type ${typeClass}">${item.type}</div>` : ''}
      </div>
      <button class="add-btn" data-id="${item.id}" onclick="addItem('${item.id}','${safeName}','${safeDesc}')">+</button>
      <div class="qty-ctl" data-id="${item.id}">
        <button class="qty-btn" onclick="removeItem('${item.id}')">−</button>
        <span class="qty-n">1</span>
        <button class="qty-btn" onclick="addItem('${item.id}','${safeName}','${safeDesc}')">+</button>
      </div>
    </div>`;
}

function renderMenu() {
  // Nav
  const navInner = document.getElementById('navInner');
  navInner.innerHTML = MENU.map(s =>
    `<button class="nav-btn" data-target="${s.id}" onclick="scrollToSection('${s.id}')">${s.emoji} ${s.label}</button>`
  ).join('');

  // Sections
  const main = document.getElementById('menuMain');
  main.innerHTML = MENU.map(section => {
    let inner = '';

    if (section.wine) {
      inner = section.regions.map(region => `
        <div class="wine-region-badge">${region.name}</div>
        ${region.bodegas.map(b => `
          <div class="wine-bodega">
            <div class="wine-bodega-name">${b.name}</div>
            <div class="menu-grid">${b.items.map(itemCard).join('')}</div>
          </div>`).join('')}
      `).join('');
    } else {
      inner = `<div class="menu-grid">${section.items.map(itemCard).join('')}</div>`;
    }

    return `
      <section class="section" id="${section.id}" data-id="${section.id}">
        <div class="section-head">
          <h2 class="section-title">${section.emoji} ${section.label}</h2>
          ${section.note ? `<span class="section-note">${section.note}</span>` : ''}
        </div>
        ${inner}
      </section>`;
  }).join('');
}

function scrollToSection(id) {
  document.getElementById(id)?.scrollIntoView({ behavior:'smooth', block:'start' });
}

// ─── Active nav on scroll ───
function initObserver() {
  const sections = document.querySelectorAll('.section[data-id]');
  const btns = document.querySelectorAll('.nav-btn');
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const id = e.target.dataset.id;
        btns.forEach(b => b.classList.toggle('active', b.dataset.target === id));
        // scroll active btn into view in nav
        const activeBtn = document.querySelector(`.nav-btn[data-target="${id}"]`);
        activeBtn?.scrollIntoView({ inline:'nearest', block:'nearest' });
      }
    });
  }, { threshold: 0.15, rootMargin: '-55px 0px -45% 0px' });
  sections.forEach(s => obs.observe(s));
}

// ─── INIT ───
renderMenu();
initObserver();
</script>
